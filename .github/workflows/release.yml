name: Publish Tec-Tac UI Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tec-tac-ui-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid VERSION: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Check whether release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $VERSION already exists; nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Preflight signed source tree
        if: steps.existing.outputs.exists == 'false'
        run: bash scripts/preflight-signing-tree.sh

      - name: Set up Node.js
        if: steps.existing.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        if: steps.existing.outputs.exists == 'false'
        run: npm install --no-package-lock

      - name: Run UI foundation tests
        if: steps.existing.outputs.exists == 'false'
        run: npm test

      - name: Run release integrity test
        if: steps.existing.outputs.exists == 'false'
        run: bash tests/release-integrity.sh

      - name: Build production UI
        if: steps.existing.outputs.exists == 'false'
        run: npm run build

      - name: Package compiled UI
        if: steps.existing.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test -d dist
          cd dist
          zip -r "../tec-tac-ui-${VERSION}-dist.zip" .

      - name: Create GitHub release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES="RELEASE_NOTES_${VERSION}.md"
          test -f "$NOTES"

          gh release create "$VERSION" \
            "tec-tac-ui-${VERSION}-dist.zip#Compiled Tec-Tac UI ${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Release ${VERSION}" \
            --notes-file "$NOTES"
